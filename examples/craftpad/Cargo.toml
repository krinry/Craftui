[package]
name = "craftui-example-craftpad"
description = "Craftpad — An interactive in-browser playground and desktop studio for CraftUI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
name = "craftui_example_craftpad"
crate-type = ["lib", "cdylib"]
path = "src/lib.rs"

[[bin]]
name = "craftui-craftpad"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["craftui/desktop"]

[lints]
workspace = true

[dependencies]
craftui = { workspace = true, default-features = false, features = [
    "dsl",
    "embedded-fallback-font",
    "gpu-sdf",
    "gpu-vello",
    "cpu-vello",
    "cpu-tiny-skia",
] }
craftui-dsl.workspace = true
craftui-runtime.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
craftui-platform-web = { workspace = true, features = ["gpu-sdf", "cpu-tiny-skia"] }
wasm-bindgen.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = ["Window", "Storage"] }

[build-dependencies]
craftui-dsl.workspace = true
