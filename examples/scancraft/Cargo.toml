[package]
name = "craftui-example-scancraft"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "craftui_example_scancraft"
crate-type = ["lib", "cdylib"]
path = "src/lib.rs"

[[bin]]
name = "craftui-scancraft"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["craftui/desktop"]

[lints]
workspace = true

[dependencies]
craftui = { workspace = true, default-features = false, features = [
    "dsl",
    "embedded-fallback-font",
    "gpu-sdf",
    "gpu-vello",
    "cpu-vello",
    "cpu-tiny-skia",
] }

[target.'cfg(target_os = "android")'.dependencies]
craftui = { workspace = true, default-features = false, features = ["android", "hot-reload"] }
jni.workspace = true
ndk-context.workspace = true

[build-dependencies]
craftui-dsl.workspace = true
