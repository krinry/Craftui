[workspace]
resolver = "2"
members = [
    "crates/craftui-core",
    "crates/craftui-reactive",
    "crates/craftui-layout",
    "crates/craftui-text",
    "crates/craftui-render",
    "crates/craftui-a11y",
    "crates/craftui-widgets",
    "crates/craftui-dsl",
    "crates/craftui-runtime",
    "crates/craftui-macros",
    "crates/craftui-platform-desktop",
    "crates/craftui-platform-android",
    "crates/craftui-platform-ios",
    "crates/craftui-platform-web",
    "crates/craftui",
    "tools/craftui-cli",
    "tools/craftui-lsp",
    "examples/counter",
    "examples/showcase",
    "examples/todo_crud",
    "examples/settings_form",
    "examples/canvas_paint",
    "examples/scancraft",
    "examples/whiteboard",
    "examples/notes",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/krinry/Craftui"
authors = ["CraftUI Contributors"]

[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
# Internal workspace crates
craftui-core = { path = "crates/craftui-core", version = "0.1.0" }
craftui-reactive = { path = "crates/craftui-reactive", version = "0.1.0" }
craftui-layout = { path = "crates/craftui-layout", version = "0.1.0" }
craftui-text = { path = "crates/craftui-text", version = "0.1.0", default-features = false }
craftui-render = { path = "crates/craftui-render", version = "0.1.0", default-features = false }
craftui-a11y = { path = "crates/craftui-a11y", version = "0.1.0" }
craftui-widgets = { path = "crates/craftui-widgets", version = "0.1.0" }
craftui-dsl = { path = "crates/craftui-dsl", version = "0.1.0" }
craftui-runtime = { path = "crates/craftui-runtime", version = "0.1.0" }
craftui-macros = { path = "crates/craftui-macros", version = "0.1.0" }
craftui-platform-desktop = { path = "crates/craftui-platform-desktop", version = "0.1.0", default-features = false }
craftui-platform-android = { path = "crates/craftui-platform-android", version = "0.1.0", default-features = false }
craftui-platform-ios = { path = "crates/craftui-platform-ios", version = "0.1.0", default-features = false }
craftui-platform-web = { path = "crates/craftui-platform-web", version = "0.1.0", default-features = false }
craftui = { path = "crates/craftui", version = "0.1.0" }

# Core permissive ecosystem crates
bitflags = "2.9"
bytemuck = { version = "1.25", features = ["derive"] }
slotmap = "1.1"
thiserror = "2.0"
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
pollster = "0.4"
png = "0.18"

# Vector, Layout, Text, GPU, Windowing, A11y
kurbo = "0.13.1"
peniko = "0.6.1"
taffy = "0.15.1"
parley = "0.12.0"
fontique = "0.12.0"
skrifa = "0.44"
ab_glyph_rasterizer = "0.1.10"
guillotiere = "0.7.0"
vello = "0.11.0"
vello_cpu = { version = "0.3.0", features = ["std", "png", "text", "u8_pipeline"] }
tiny-skia = "0.12.0"
wgpu = "30.0.1"
winit = "0.30.13"
softbuffer = "0.4.8"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal", "wayland"] }
x11-clipboard = "0.9"
wl-clipboard-rs = "0.9"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Memory"] }
accesskit = "0.25.2"
accesskit_winit = "0.34.2"

# DSL, Macros, Runtime, Tooling
logos = "0.16"
rowan = "0.16.1"
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full", "extra-traits"] }
notify = "8.2"
clap = { version = "4.6", features = ["derive"] }
tower-lsp = "0.20"
tokio = { version = "1.54", features = ["full"] }

# Platform targets
android-activity = { version = "0.6", features = ["game-activity"] }
jni = "0.22"
ndk-context = "0.1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"
js-sys = "0.3"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
strip = true
