[package]
name = "craftui-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "craftui"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
craftui-core.workspace = true
craftui-reactive.workspace = true
craftui-text = { path = "../../crates/craftui-text", features = ["embedded-fallback-font"] }
craftui-render = { path = "../../crates/craftui-render", features = ["gpu-sdf", "cpu-vello", "cpu-tiny-skia"] }
craftui-widgets.workspace = true
craftui-dsl.workspace = true
craftui-runtime.workspace = true
craftui-platform-desktop = { path = "../../crates/craftui-platform-desktop", features = ["hot-reload", "gpu-sdf", "cpu-vello", "cpu-tiny-skia"] }
clap.workspace = true
notify.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tracing.workspace = true
