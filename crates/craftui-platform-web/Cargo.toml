[package]
name = "craftui-platform-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["gpu-sdf", "gpu-vello", "cpu-vello", "cpu-tiny-skia"]
gpu-sdf = ["craftui-render/gpu-sdf"]
gpu-vello = ["craftui-render/gpu-vello"]
cpu-vello = ["craftui-render/cpu-vello"]
cpu-tiny-skia = ["craftui-render/cpu-tiny-skia"]

[lints]
workspace = true

[dependencies]
craftui-core.workspace = true
craftui-layout.workspace = true
craftui-reactive.workspace = true
craftui-a11y.workspace = true
craftui-render.workspace = true
craftui-widgets.workspace = true
slotmap = "1.1"
tracing.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
wgpu.workspace = true
web-sys = { workspace = true, features = [
    "Window",
    "Document",
    "Element",
    "CssStyleDeclaration",
    "Node",
    "HtmlElement",
    "HtmlCanvasElement",
    "HtmlInputElement",
    "DomRect",
    "Event",
    "EventTarget",
    "PointerEvent",
    "WheelEvent",
    "KeyboardEvent",
    "CompositionEvent",
    "InputEvent",
    "Location",
    "HashChangeEvent",
    "Performance",
    "Navigator",
    "Clipboard",
    "ClipboardEvent",
    "DataTransfer",
    "CanvasRenderingContext2d",
    "ImageData",
] }

[dev-dependencies]
craftui-render = { path = "../craftui-render", features = ["cpu-vello", "cpu-tiny-skia"] }
craftui-text = { path = "../craftui-text", features = ["embedded-fallback-font"] }
