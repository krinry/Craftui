[package]
name = "craftui-platform-android"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
crate-type = ["lib", "cdylib"]

[features]
default = ["gpu-sdf", "gpu-vello", "cpu-vello", "cpu-tiny-skia", "hot-reload"]
builtin-main = []
hot-reload = ["dep:craftui-runtime"]
gpu-sdf = ["craftui-render/gpu-sdf", "dep:wgpu", "dep:pollster"]
gpu-vello = ["craftui-render/gpu-vello", "dep:wgpu", "dep:pollster"]
cpu-vello = ["craftui-render/cpu-vello"]
cpu-tiny-skia = ["craftui-render/cpu-tiny-skia"]

[lints]
workspace = true

[dependencies]
craftui-core.workspace = true
craftui-layout.workspace = true
craftui-reactive.workspace = true
craftui-render.workspace = true
craftui-text.workspace = true
craftui-widgets.workspace = true
craftui-runtime = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
wgpu = { workspace = true, optional = true }
pollster = { workspace = true, optional = true }
tracing.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
android-activity.workspace = true
raw-window-handle = "0.6"

[dev-dependencies]
craftui-render = { path = "../craftui-render", features = ["cpu-vello", "cpu-tiny-skia"] }
craftui-text = { path = "../craftui-text", features = ["embedded-fallback-font"] }
