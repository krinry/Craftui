name: CraftUI CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  license-guard:
    name: License Purity (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses

  test-desktop:
    name: Test & Clippy (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install Linux System Deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libfontconfig1-dev libfreetype-dev libx11-dev
      - run: cargo fmt --all -- --check
      - name: Clippy (annotate compiler errors)
        shell: bash
        run: |
          cargo clippy --workspace --all-targets --message-format json > clippy.jsonl 2>&1
          code=$?
          echo "::notice::clippy exit=$code jsonl_bytes=$(wc -c < clippy.jsonl | tr -d ' ') jsonl_lines=$(wc -l < clippy.jsonl | tr -d ' ') python3=$(command -v python3 || echo MISSING)"
          errlines=$(wc -l < clippy.jsonl | tr -d ' ')
          echo "::notice::first_lines=$(head -c 1500 clippy.jsonl | tr '\n' '|' | sed 's/%/%25/g' | tr '\r' ' ')"
          blob=$(grep -E '"level":"(error|ice|failure-note)"' clippy.jsonl | head -40 | tr '\n' '|' | tail -c 1500 | sed 's/%/%25/g' | tr '\r' ' ')
          echo "::error::error_lines(latest<=1500B): $blob"
          exit $code
      - run: cargo test --workspace
      - name: Minimal-Feature Compile Check
        if: matrix.os == 'ubuntu-latest'
        run: cargo check -p craftui --no-default-features --features "desktop,dsl,hot-reload,embedded-fallback-font,gpu-sdf"

  check-wasm:
    name: Web WASM Clippy & Minimal Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - run: cargo clippy -p craftui-platform-web --target wasm32-unknown-unknown -- -D warnings
      - run: cargo check -p craftui-platform-web --target wasm32-unknown-unknown --no-default-features --features gpu-sdf

  check-android:
    name: Android Clippy & Minimal Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
          components: clippy
      - name: Clippy & Minimal-Feature Check with preinstalled NDK
        run: |
          NDK_BIN="${ANDROID_NDK_LATEST_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="${NDK_BIN}/aarch64-linux-android26-clang"
          export CXX_aarch64_linux_android="${NDK_BIN}/aarch64-linux-android26-clang++"
          export AR_aarch64_linux_android="${NDK_BIN}/llvm-ar"
          cargo clippy -p craftui-platform-android --target aarch64-linux-android -- -D warnings
          cargo check -p craftui-platform-android --target aarch64-linux-android --no-default-features --features gpu-sdf

  bench-smoke:
    name: Benchmark Smoke Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux System Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libfontconfig1-dev libfreetype-dev libx11-dev
      - name: Run Perf Suite Smoke Benchmark
        run: |
          cargo bench -p craftui --bench perf_suite -- --quick --json > bench-smoke.json
          cat bench-smoke.json
          python3 -m json.tool bench-smoke.json > /dev/null
