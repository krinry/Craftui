name: VS Code extension packages

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64
          - os: windows-2022
            target: win32-x64
          - os: macos-15
            target: darwin-arm64
          - os: macos-15-intel
            target: darwin-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test executable discovery
        run: node --test editors/vscode/test/executable.test.js
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libfontconfig1-dev libfreetype-dev libx11-dev
      - name: Build CLI and language server
        run: cargo build --locked --release -p craftui-cli -p craftui-lsp
      - name: Bundle binaries
        run: |
          mkdir -p editors/vscode/bin
          if [[ "$RUNNER_OS" == Windows ]]; then
            cp target/release/{craftui.exe,craftui-lsp.exe} editors/vscode/bin/
          else
            cp target/release/{craftui,craftui-lsp} editors/vscode/bin/
          fi
      - name: Create platform-specific VSIX
        working-directory: editors/vscode
        run: npx --yes @vscode/vsce@3.6.2 package --target '${{ matrix.target }}' --out 'craftui-${{ matrix.target }}.vsix'
      - uses: actions/upload-artifact@v4
        with:
          name: craftui-vscode-${{ matrix.target }}
          path: editors/vscode/craftui-${{ matrix.target }}.vsix
          if-no-files-found: error
