[book]
authors = ["CraftUI Contributors"]
language = "en"
multilingual = false
src = "src"
title = "The CraftUI Book"

[output.html]
git-repository-url = "https://github.com/krinry/Craftui"
edit-url-template = "https://github.com/krinry/Craftui/edit/main/docs/{path}"
cname = "docs.craftui.dev"
default-theme = "rust"
preferred-dark-theme = "navy"
mathjax-support = false
copy-fonts = true

[output.html.fold]
enable = true
level = 1
